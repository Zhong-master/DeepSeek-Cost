name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-pil \
            gir1.2-gtk-3.0 gir1.2-pango-1.0 \
            gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1

      - name: 代码风格检查
        run: python3 -m flake8 --select=F,E9 --max-line-length=130 src tests || true

      - name: 单元 / 集成测试（全离线，使用本地假接口）
        run: bash tests/run_tests.sh

      # GUI 冒烟测试需要真实的 X 会话与 ffmpeg，CI 里用 xvfb 跑
      - name: GUI 冒烟测试（xvfb）
        run: |
          sudo apt-get install -y --no-install-recommends xvfb ffmpeg
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 tests/smoke_gui.py
